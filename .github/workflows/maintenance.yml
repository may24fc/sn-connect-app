name: Maintenance

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # Check for outdated dependencies
  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Check for outdated dependencies
        run: |
          pnpm outdated || true
          echo "### Outdated Dependencies Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pnpm outdated >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Run security audit
        run: |
          echo "### Security Audit Report" >> $GITHUB_STEP_SUMMARY
          pnpm audit --audit-level=moderate >> $GITHUB_STEP_SUMMARY || true

  # Clean up old artifacts
  cleanup-artifacts:
    name: Clean Up Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '30 days'
          skip-recent: 5

  # Clean up old workflow runs
  cleanup-workflows:
    name: Clean Up Workflow Runs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 60
          keep_minimum_runs: 10

  # Check repository health
  repo-health:
    name: Repository Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for large files
        run: |
          echo "### Large Files Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find files larger than 1MB
          find . -type f -size +1M -not -path "*/node_modules/*" -not -path "*/.git/*" | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "- $file ($size)" >> $GITHUB_STEP_SUMMARY
          done || echo "No large files found" >> $GITHUB_STEP_SUMMARY

      - name: Check for dead code
        run: |
          echo "### Dead Code Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find unused exports (this is a simplified check)
          echo "Run \`pnpm exec ts-unused-exports\` locally for detailed analysis" >> $GITHUB_STEP_SUMMARY

      - name: Check for TODO/FIXME items
        run: |
          echo "### TODO/FIXME Items" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TODO_COUNT=$(grep -r "TODO" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=.next . | wc -l)
          FIXME_COUNT=$(grep -r "FIXME" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=.next . | wc -l)

          echo "- **TODO items:** $TODO_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **FIXME items:** $FIXME_COUNT" >> $GITHUB_STEP_SUMMARY

  # Update dependencies (creates PR)
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Update dependencies
        run: |
          pnpm update --latest --recursive

      - name: Run tests
        run: |
          pnpm install
          pnpm test || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): Update dependencies to latest versions'
          title: 'chore(deps): Update dependencies'
          body: |
            ## Automated Dependency Updates

            This PR updates all dependencies to their latest versions.

            ### Changes
            - Updated all packages to latest compatible versions
            - Ran tests to ensure compatibility

            ### Testing
            - [ ] All tests pass
            - [ ] Manual testing completed
            - [ ] No breaking changes detected

            ### Notes
            Please review the changes carefully, especially major version updates.

            🤖 Generated by automated maintenance workflow

            Co-Authored-By: Claude Opus 4.5 <noreply@anthropic.com>
          branch: chore/dependency-updates
          delete-branch: true
